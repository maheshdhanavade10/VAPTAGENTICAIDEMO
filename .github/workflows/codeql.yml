name: "CodeQL"

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      security-events: write # Required to update/clear alerts in the Security Tab
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: 'csharp'
        # These query suites find the most common vulnerabilities
        queries: security-extended,security-and-quality

    - name: Build
      run: |
        dotnet restore VaptTestingDemo.API/VaptTestingDemo.API.csproj
        dotnet build VaptTestingDemo.API/VaptTestingDemo.API.csproj --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:csharp"