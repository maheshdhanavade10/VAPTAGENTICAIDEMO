name: Advanced C# Security Scan with Auto-Fix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- JOB 1: CodeQL Analysis ---
  codeql-analysis:
    name: CodeQL Analysis (C#)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # --- JOB 2: SonarCloud Analysis ---
  sonar-analysis:
    name: SonarCloud Scan
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Sonar Scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"maheshdhanavade10_VAPTAGENTICAIDEMO" /o:"maheshdhanavade10" /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build
          dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

  # --- JOB 3: Auto-fix and PR Creation ---
  auto-fix-pr:
    name: Auto-fix and Create PR
    runs-on: ubuntu-latest
    needs: [codeql-analysis, sonar-analysis]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET format auto-fixer
        run: |
          dotnet format --verify-no-changes || dotnet format

      - name: Detect changes
        id: changes
        run: |
          STATUS=$(git status --porcelain)
          if [ -z "$STATUS" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="fix/sonar-codeql-issues"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            BRANCH="fix/sonar-codeql-issues-$(date +%Y%m%d%H%M%S)"
          fi
          git checkout -b "$BRANCH"
          git add .
          git commit -m "Auto-fix: SonarCloud & CodeQL issues"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.commit.outputs.branch }}
          base: main
          title: "Auto-fix: SonarCloud & CodeQL issues"
          body: |
            This PR contains automated fixes for issues detected by SonarCloud and CodeQL.
            Generated by workflow: Advanced C# Security Scan with Auto-Fix
          draft: false
          labels: |
            security
            automated-fix
