name: CodeQL Detection and Auto-Fix PR

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_codeql_only:
        description: 'Run only CodeQL detection and auto-fix'
        required: true
        default: true
        type: boolean

concurrency:
  group: codeql-fix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql-analysis:
    name: CodeQL analysis (C#)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  codeql-analysis-autofix:
    name: Auto-fix and create PR
    runs-on: ubuntu-latest
    needs: codeql-analysis
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0
      run: echo "Repository checked out successfully."

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
      run: echo ".NET SDK 8.0.x set up successfully."

    - name: Run .NET format auto-fixer
      run: |
        echo "Starting .NET format check..."
        dotnet format --verify-no-changes || (echo "Formatting changes applied." && dotnet format)
        echo ".NET format step completed."

    - name: Detect changes
      id: changes
      run: |
        STATUS=$(git status --porcelain)
        echo "Git status output: $STATUS"
        if [ -z "$STATUS" ]; then
          echo "No changes detected."
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "Changes detected."
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      id: commit
      if: steps.changes.outputs.changed == 'true'
      run: |
        echo "Starting commit process..."
        BRANCH="fix/codeql-issues"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
          BRANCH="fix/codeql-issues-$(date +%Y%m%d%H%M%S)"
          echo "Branch already exists, using new branch: $BRANCH"
        else
          echo "Using branch: $BRANCH"
        fi
        git checkout -b "$BRANCH"
        echo "Checked out new branch: $BRANCH"
        git add .
        echo "Staged changes."
        git commit -m "Auto-fix: CodeQL-detected vulnerabilities and formatting"
        echo "Committed changes."
        git push origin "$BRANCH"
        echo "Pushed branch to origin."
        echo "branch=$BRANCH" >> $GITHUB_OUTPUT

    - name: Create Pull Request
      id: pr
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        branch: ${{ steps.commit.outputs.branch }}
        base: main
        title: "Auto-fix: CodeQL vulnerability fixes and formatting"
        body: |
          This PR contains automated fixes for CodeQL-detected vulnerabilities and formatting issues.
          Generated by workflow: CodeQL Detection and Auto-Fix PR
        draft: false
        labels: |
          security
          automated-fix

    - name: Log PR creation result
      run: |
        if [ "${{ steps.pr.outputs.pull-request-number }}" ]; then
          echo "PR created successfully: #${{ steps.pr.outputs.pull-request-number }} - ${{ steps.pr.outputs.pull-request-url }}"
        else
          echo "PR creation failed or skipped (no changes detected)."
        fi