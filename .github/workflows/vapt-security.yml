name: VAPT Security Scan and Auto-Fix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_security_scan:
        description: 'Run security scan and auto-fix'
        required: true
        default: true
        type: boolean
      run_dependency_review:
        description: 'Run dependency review (requires PR context or manual refs)'
        required: false
        default: false
        type: boolean

# Sensible concurrency to avoid overlapping auto-fix branches
concurrency:
  group: vapt-security-${{ github.ref }}
  cancel-in-progress: true

# Set minimal global permissions, grant job-specific ones where needed
permissions:
  contents: read

jobs:
  security-scan:
    name: VAPT agent and build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_security_scan == true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build .NET project
      run: |
        cd VaptTestingDemo.API
        dotnet build --configuration Release

    - name: Run VAPT Agent
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scripts/vapt_agent.py
      continue-on-error: true

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: |
          *.log
          VaptTestingDemo.API/Controllers/TestController.cs.backup
        retention-days: 30

  codeql-analysis:
    name: CodeQL analysis (C#)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  codeql-analysis-autofix:
    name: Auto-fix and create PR
    runs-on: ubuntu-latest
    needs: codeql-analysis
    permissions:
      contents: write    # needed to push branch and create PR
      pull-requests: write

    steps:
    - name: Checkout repository (with write token)
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run .NET format auto-fixer
      run: |
        # Try verify, and if there are changes needed, apply them
        dotnet format --verify-no-changes || dotnet format

    - name: Detect changes
      id: changes
      run: |
        CHANGED=$(git status --porcelain)
        if [ -z "$CHANGED" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Create fix branch, commit, and push
      if: steps.changes.outputs.changed == 'true'
      run: |
        BRANCH="fix/codeql-issues"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # If branch already exists locally or remotely, create a unique suffix
        if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
          BRANCH="fix/codeql-issues-$(date +%Y%m%d%H%M%S)"
        fi
        git checkout -b "$BRANCH"
        git add .
        git commit -m "Auto-fix: formatting and simple refactors after CodeQL/format checks"
        git push origin "$BRANCH"
        echo "branch=$BRANCH" >> $GITHUB_OUTPUT

    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        branch: ${{ steps.changes.outputs.branch }}
        base: main
        title: "Auto-fix: CodeQL follow-ups and formatting"
        body: |
          This PR contains automated formatting and simple refactors triggered after CodeQL analysis.
          - Generated by workflow: VAPT Security Scan and Auto-Fix
          - Please review any changes impacting security-sensitive code paths.
        draft: false
        labels: |
          security
          automated-fix

  dependency-review:
    name: Dependency review (PR or manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Skip dependency review (manual trigger without PR)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_dependency_review == 'false'
      run: |
        echo "ℹ️ Dependency review skipped - enable 'Run dependency review' option for manual scans"
        echo "📝 Dependency review requires PR context to compare dependency changes"

    - name: Dependency Review
      if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_dependency_review == 'true')
      uses: actions/dependency-review-action@v3
      with:
        base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}
        head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

  security-audit:
    name: Trivy filesystem scan and upload to Security tab
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner (filesystem)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
