name: VAPT Security Scan and Auto-Fix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_security_scan:
        description: 'Run security scan and auto-fix'
        required: true
        default: 'true'
        type: boolean
      run_dependency_review:
        description: 'Run dependency review (requires PR context or manual refs)'
        required: false
        default: 'false'
        type: boolean

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Build .NET project
      run: |
        cd VaptTestingDemo.API
        dotnet build --configuration Release

    - name: Run VAPT Agent
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scripts/vapt_agent.py
      continue-on-error: true

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: |
          *.log
          VaptTestingDemo.API/Controllers/TestController.cs.backup
        retention-days: 30

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  dependency-review:
    runs-on: ubuntu-latest
    # Run on pull requests or when manually triggered with dependency review enabled
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_dependency_review == 'true')
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Fetch full history for dependency comparison
        fetch-depth: 0
    - name: Dependency Review
      uses: actions/dependency-review-action@v3
      with:
        # For manual runs, use current branch as head and main as base
        base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}
        head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'