name: Advanced C# Security Scan with Auto-Fix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  # --- JOB 1: CodeQL Analysis ---
  codeql-analysis:
    name: CodeQL Analysis (C#)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # --- JOB 2: SonarCloud Analysis ---
  sonar-analysis:
    name: SonarCloud Scan
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Sonar Scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG_KEY: ${{ secrets.SONAR_ORG_KEY }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet-sonarscanner begin \
            /k:"${SONAR_PROJECT_KEY}" \
            /o:"${SONAR_ORG_KEY}" \
            /d:sonar.login="${SONAR_TOKEN}" \
            /d:sonar.host.url="${SONAR_HOST_URL}"

          dotnet build

          dotnet-sonarscanner end /d:sonar.login="${SONAR_TOKEN}"

  # --- JOB 3: OWASP Dependency Check (SCA) ---
  owasp-dependency-check:
    name: OWASP Dependency Check (SCA)
    runs-on: ubuntu-latest
    needs: [codeql-analysis, sonar-analysis]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@v3.0.3
        with:
          project: "VAPTAGENTICAIDEMO"
          path: "."
          format: "ALL"
          out: "dependency-check-report"

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: dependency-check-report

  # --- JOB 4: OWASP ZAP Baseline Scan (DAST) ---
  owasp-zap:
    name: OWASP ZAP Baseline Scan (DAST)
    runs-on: ubuntu-latest
    needs: [codeql-analysis, sonar-analysis]
    if: always()

    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "https://your-app-url.com"   # Replace with your deployed app URL
          cmd_options: "-a"

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

  # --- JOB 5: Auto-fix and PR Creation ---
  auto-fix-pr:
    name: Auto-fix and Create PR (SonarCloud + CodeQL)
    runs-on: ubuntu-latest
    needs: [codeql-analysis, sonar-analysis, owasp-dependency-check]
    if: always()
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET format auto-fixer
        run: |
          dotnet format --verify-no-changes || dotnet format

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch SonarCloud Issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          curl -s -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&resolved=false" \
            -o sonar_issues.json

      - name: Parse and Apply Rule-based Fixes
        run: |
          cat sonar_issues.json | jq '.issues[] | {rule, message, component, line}' > parsed_issues.json
          find . -name "*.cs" -exec sed -i '/^using .*;$/d' {} \;

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="fix/security-auto-fixes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            BRANCH="fix/security-auto-fixes-$(date +%Y%m%d%H%M%S)"
          fi

          git checkout -b "$BRANCH"
          git add .
          git commit -m "Automated security fixes (CodeQL + Sonar + OWASP)"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.commit.outputs.branch }}
          base: main
          title: "Automated Security Fixes (CodeQL + SonarCloud + OWASP)"
          body: |
            This PR includes automated fixes for:
            - CodeQL findings
            - SonarCloud issues
            - OWASP dependency vulnerabilities (where possible)

            Generated by workflow: Advanced C# Security Scan with Auto-Fix
          draft: false
          labels: |
            security
            automated-fix
