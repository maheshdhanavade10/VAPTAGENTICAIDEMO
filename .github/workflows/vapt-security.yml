name: CodeQL Detection and Auto-Fix PR

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_codeql_only:
        description: 'Run only CodeQL detection and auto-fix'
        required: true
        default: true
        type: boolean

concurrency:
  group: codeql-fix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql-analysis:
    name: CodeQL analysis (C#)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  codeql-analysis-autofix:
    name: Auto-fix and create PR
    runs-on: ubuntu-latest
    needs: codeql-analysis
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run .NET format auto-fixer
      run: |
        dotnet format --verify-no-changes || dotnet format

    - name: Detect changes
      id: changes
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      id: commit
      if: steps.changes.outputs.changed == 'true'
      run: |
        BRANCH="fix/codeql-issues"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
          BRANCH="fix/codeql-issues-$(date +%Y%m%d%H%M%S)"
        fi
        git checkout -b "$BRANCH"
        git add .
        git commit -m "Auto-fix: CodeQL-detected vulnerabilities and formatting"
        git push origin "$BRANCH"
        echo "branch=$BRANCH" >> $GITHUB_OUTPUT

    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        branch: ${{ steps.commit.outputs.branch }}
        base: main
        title: "Auto-fix: CodeQL vulnerability fixes and formatting"
        body: |
          This PR contains automated fixes for CodeQL-detected vulnerabilities and formatting issues.
          Generated by workflow: CodeQL Detection and Auto-Fix PR
        draft: false
        labels: |
          security
          automated-fix